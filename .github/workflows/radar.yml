name: Revenue radar

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      notify:
        description: 'Create a GitHub Issue digest for new signals (opt in)'
        type: boolean
        default: false

concurrency:
  group: revenue-radar-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check radar rules
        run: python -m unittest discover -s tests -v
      - name: Scan public daily revenue data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m radar.cli --output out --resume-github
      - name: Add report to run summary
        run: cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: revenue-radar-report
          path: out/
          retention-days: 30
          overwrite: true

  notify:
    needs: scan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.notify))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: revenue-radar-report
          path: out/
      - name: Create one deduplicated issue digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m radar.notify
